name: CI — Typecheck, Forensic Unit Suite & Extension Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run strict TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest forensic & pacing test suite
        run: npm test

      - name: Build unpacked Manifest V3 Chrome Extension
        run: npm run build
