name: Publish to Chrome Web Store

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish-cws:
    name: Build & Upload to Chrome Web Store
    runs-on: ubuntu-latest
    steps:
      - name: Check Chrome Web Store credentials
        id: check_creds
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -n "$CWS_EXTENSION_ID" ] && [ -n "$CWS_CLIENT_ID" ] && [ -n "$CWS_CLIENT_SECRET" ] && [ -n "$CWS_REFRESH_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping automated CWS upload (CWS_* secrets not configured yet)."
          fi

      - name: Checkout repository
        if: steps.check_creds.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        if: steps.check_creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install, Test & Package Chrome Web Store ZIP
        if: steps.check_creds.outputs.ready == 'true'
        id: pkg
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run package
          ZIP_FILE=$(ls -1 chess-sentinel-v*-chrome.zip | head -n 1)
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload & Publish via Chrome Web Store API
        if: steps.check_creds.outputs.ready == 'true'
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          ZIP_FILE: ${{ steps.pkg.outputs.zip_file }}
        run: |
          ACCESS_TOKEN=$(curl -sS -X POST "https://oauth2.googleapis.com/token" \
            -d "client_id=${CLIENT_ID}" \
            -d "client_secret=${CLIENT_SECRET}" \
            -d "refresh_token=${REFRESH_TOKEN}" \
            -d "grant_type=refresh_token" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); if(!d.access_token) process.exit(1); process.stdout.write(d.access_token);")
          curl -sSf -X PUT \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -T "${ZIP_FILE}" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${EXTENSION_ID}"
          curl -sSf -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${EXTENSION_ID}/publish"
