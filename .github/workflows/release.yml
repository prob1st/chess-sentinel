name: Release — Build & Publish Chrome Extension ZIP

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: chess-sentinel-v*-chrome.zip
          generate_release_notes: true
